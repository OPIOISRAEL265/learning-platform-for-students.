<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Contact Us</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
            margin: 0;  
            padding: 0;  
            background-image: url('witu_cover.jpg'); /* Replace with your image URL */  
            background-size: cover;  
            background-position: center;  
            color: white;  
        }  
        img{
            width:150px;
            boarder-radius:100px;
            float: left;
            margin-top: 10px;
        }
        .logo {  
            color: blue;  
            font-size: 35px;  
            font-family: Arial, sans-serif;   
            padding-left: 20px;  
            float: left;  
            padding-top: 10px;  
}  
        .navbar {  
            width: 1200px;  
            height: 75px;  
            margin: auto;  
        } 
        ul {  
            float: left;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            list-style: none;   
            
        } 
        ul li {  
            margin-left: 100px;  
            margin-top: 30px;  
            font-size: 20px;  
        }  

        ul li a {  
            text-decoration: none;  
            color: white;  
            font-family: Arial, sans-serif;   
            font-weight: bold;  
            transition: color 0.4s ease-in-out;  
        }  

        ul li a:hover {  
            color: green;  
        }  

        .container {  
            width: 90%;  /* Adjusted for smaller screens */  
            max-width: 400px;  
            margin: 100px auto;   
            background-color: rgba(0, 0, 0, 0.8); /* Darker background for better contrast */  
            padding: 20px;  
            border-radius: 8px;  
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Added shadow for depth */  
        }  

        h1 {  
            text-align: center;  
            margin-bottom: 20px;  
            font-size: 28px;  
        }  

        label {  
            display: block;  
            margin: 10px 0 5px;  
            font-weight: bold;  
        }  

        input[type="text"],  
        input[type="email"],  
        textarea {  
            width: 100%;  
            padding: 6px;  
            margin-bottom: 15px;  
            border: 2px solid #fff;  
            border-radius: 4px;  
            background: rgba(255, 255, 255, 0.1); /* Slightly transparent white for input backgrounds */  
            color: white;  
            transition: border 0.3s; /* Smooth border transition */  
        }  

        input[type="text"]:focus,  
        input[type="email"]:focus,  
        textarea:focus {  
            border: 2px solid #28a745; /* Green border on focus */  
            outline: none; /* Remove outline for focus */  
        }  

        input[type="submit"] {  
            background-color: #28a745;  
            color: white;  
            border: none;  
            padding: 12px;  
            border-radius: 4px;  
            cursor: pointer;  
            width: 100%;  
            font-size: 16px;  
            transition: background-color 0.3s; /* Smooth background transition */  
        }  

        input[type="submit"]:hover {  
            background-color: #218838; /* Darker green on hover */  
        }  

        .message {  
            text-align: center;  
            margin-top: 10px;  
            font-size: 18px;  
            display: none; /* Hide by default */  
        }  

        .success {  
            color: #28a745; /* Green for success messages */  
        }  

        .error {  
            color: #dc3545; /* Red for error messages */  
        }  

        @media (max-width: 600px) {  
            .container {  
                margin: 20px; /* Better spacing on smaller screens */  
            }  
        }  
    </style>  
    <img src="elogo-removebg-preview.png"> 
</head>  
<body> 
    <div class="navbar">
        <ul>
            <li><a href="BEAST.html">HOME</a></li>
            <li><a href="copy.html">ABOUT</a></li>
            <li><a href="go.html">SERVICE</a></li>
            <li><a href="fincontact.html">CONTACT</a></li>
        </ul>
    </div> 

    <div class="container">  
        <h1>Contact Us</h1>  
        <div class="message" id="message"></div>  
        <form id="contact-form" onsubmit="return handleSubmit(event)">  
            <label for="name">Name:</label>  
            <input type="text" id="name" name="name" placeholder="Your Name" required aria-required="true">  

            <label for="email">Email:</label>  
            <input type="email" id="email" name="email" placeholder="Your Email" required aria-required="true">  

            <label for="message-content">Message:</label>  
            <textarea id="message-content" name="message" rows="5" placeholder="Your Message" required aria-required="true"></textarea>  

            <input type="submit" value="Send Message">
        </form>  
    </div>  

    <script>  
        function handleSubmit(event) {  
            event.preventDefault(); // Prevent the default form submission  

            const name = document.getElementById("name").value;  
            const email = document.getElementById("email").value;  
            const messageContent = document.getElementById("message-content").value;  
            const messageDiv = document.getElementById("message");  

            // Basic form validation (can be expanded as needed)  
            if (name && email && messageContent) {  
                // Simulate successful form submission (you could implement actual AJAX call here)  
                // Display success message  
                messageDiv.textContent = "Thank you, " + name + "! Your message has been sent.";  
                messageDiv.className = "message success"; // Success class  
                messageDiv.style.display = "block"; // Show the message  

                // Clear the form fields  
                document.getElementById("contact-form").reset();  
            } else {  
                // Display error message  
                messageDiv.textContent = "Please fill out all fields.";  
                messageDiv.className = "message error"; // Error class  
                messageDiv.style.display = "block"; // Show the message  
            }  

            // Note: You'd typically make an AJAX request to submit the form data here  
            // e.g. using fetch() or XMLHttpRequest to a server-side script  
        }  
    </script>
    <footer class="footer">  
        <p>&copy; 2025 Accessible Learning Solutions. All rights reserved.</p>  
        <div class="footer-links">  
            <a href="#">Privacy Policy</a>  
            <a href="#">Terms of Service</a>  
        </div>  
    </footer>    
</body>  
</html>
