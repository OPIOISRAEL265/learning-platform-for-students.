<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Educational Videos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('witu_cover.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .navbar {
            width: 100%;
            background: rgba(51, 51, 51, 0.8);
            padding: 10px 0;
            display: flex;
            align-items: center;
        }
        .navbar .icon {
            display: flex;
            align-items: center;
            margin-left: 40px;
        }
        .navbar img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .navbar .logo {
            color: #2196F3;
            font-size: 28px;
            font-weight: bold;
        }
        .navbar ul {
            display: flex;
            list-style: none;
            margin: 0 auto 0 60px;
            padding: 0;
        }
        .navbar ul li {
            margin: 0 20px;
        }
        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .navbar ul li a:hover {
            color: #2196F3;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            padding: 30px 20px;
        }
        h1 {
            text-align: center;
            color: #2196F3;
        }
        .video-list {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .video-item {
            width: 350px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .video-item h3 {
            color: #2196F3;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        @media (max-width: 800px) {
            .video-list {
                flex-direction: column;
                align-items: center;
            }
            .video-item {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="icon">
            <img src="elogo-removebg-preview.png" alt="Site Logo">
            <span class="logo">E-Learn</span>
        </div>
        <ul>
            <li><a href="final.html">HOME</a></li>
            <li><a href="copy.html">ABOUT</a></li>
            <li><a href="go.html">SERVICES</a></li>
            <li><a href="fincontact.html">CONTACT</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Watch Our Educational Videos</h1>
        <div class="video-list">
            <div class="video-item">
                <h3>Learning Platform Overview</h3>
                <video controls poster="images/learning_platform.jpg">
                    <source src="videos/learning_platform_overview.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="video-item">
                <h3>Digital Library Tour</h3>
                <video controls poster="images/digital_library.jpg">
                    <source src="videos/digital_library_tour.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="video-item">
                <h3>Communication Portal Demo</h3>
                <video controls poster="images/communication_portal.jpg">
                    <source src="videos/communication_portal_demo.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="video-item">
                <h3>Progress Tracking Overview</h3>
                <video controls poster="images/student_progress.jpg">
                    <source src="videos/progress_tracking_overview.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="video-item">
                <h3>Tutor Matching Demo</h3>
                <video controls poster="images/tutor_matching.jpg">
                    <source src="videos/tutor_matching_demo.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>
</body>
</html>
